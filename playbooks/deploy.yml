---
- name: Provision EC2 instances for Spring Boot lab
  hosts: localhost
  gather_facts: false
  vars:
    instance_name: ansible-lab-instance
    instance_type: t3.micro
    key_pair: "{{ lookup('env', 'KEY_PAIR_NAME') }}"
    ssh_key_path: "{{ lookup('env', 'SSH_KEY_PATH') }}"
    sg_id: "{{ lookup('env', 'LAB_SG_ID') }}"
    lab_tag: "{{ lookup('env', 'LAB_TAG') }}"
    region: "{{ lookup('env', 'AWS_DEFAULT_REGION') }}"
    al2023_ssm_param: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  tasks:
    - name: Resolve latest Amazon Linux 2023 AMI id via SSM public parameter
      ansible.builtin.command:
        cmd: >-
          aws ssm get-parameter --name {{ al2023_ssm_param }}
          --region {{ region }} --query Parameter.Value --output text
      register: ami_lookup
      changed_when: false

    - name: Set AMI id fact
      ansible.builtin.set_fact:
        al2023_ami_id: "{{ ami_lookup.stdout | trim }}"

    - name: Launch EC2 instances
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        key_name: "{{ key_pair }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ al2023_ami_id }}"
        security_groups:
          - "{{ sg_id }}"
        network:
          assign_public_ip: true
        tags:
          workshop: "{{ lab_tag }}"
        exact_count: 2
        filters:
          "tag:Name": "{{ instance_name }}"
          instance-state-name: [running, pending]
        wait: true
        state: running
      register: ec2

    - name: Wait for SSH to become reachable on all instances
      ansible.builtin.wait_for:
        host: "{{ item.public_ip_address }}"
        port: 22
        timeout: 180
        state: started
      loop: "{{ ec2.instances }}"

    - name: Add all instances to in-memory inventory group
      ansible.builtin.add_host:
        hostname: "{{ item.public_ip_address }}"
        groups: app_servers
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "{{ ssh_key_path }}"
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        # Forziamo l'interprete corretto direttamente qui per evitare ambiguità
        ansible_python_interpreter: /usr/bin/python3
      loop: "{{ ec2.instances }}"

    - name: Print connection info for deployed instances
      ansible.builtin.debug:
        msg: "EC2 instance ready at {{ item.public_ip_address }}"
      loop: "{{ ec2.instances }}"

- name: Deploy Spring Boot application on EC2 cluster
  hosts: app_servers
  become: true
  gather_facts: true
  roles:
    - springboot
